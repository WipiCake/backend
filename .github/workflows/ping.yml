# .github/workflows/ping.yml
name: Keep App Alive

# 매 5분마다 실행
on:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping App Service
        run: |
          # actuator/health 엔드포인트를 호출해서 앱을 깨움
          curl -fsS https://wipi-cake-enhjerf3btg0apg3.koreasouth-01.azurewebsites.net/actuator/health || true
