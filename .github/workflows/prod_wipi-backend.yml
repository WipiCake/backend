# .github/workflows/azure-deploy.yml

name: Build and deploy JAR app to Azure Web App - wipi-backend

on:
  push:
    branches: [ prod ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle CLI
        uses: gradle/gradle-build-action@v2
        with:
          cache-enabled: true

      - name: Build with Gradle
        run: gradle clean build --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: build/libs/*.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    environment:
      name: Production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      # 1) 아티팩트 루트(워크스페이스)에 그대로 다운로드
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: java-app

      # 2) build/libs/*.jar 에서 딱 하나만 deploy/app.jar 로 복사
      - name: Prepare single JAR for deploy
        run: |
          mkdir deploy
          cp build/libs/*.jar deploy/app.jar
          ls -l deploy

      # 3) Azure에 배포
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'wipi-backend'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_B6FDEDBFBDB54590BC6DAD37985E8B9B }}
          package: 'deploy/app.jar'
