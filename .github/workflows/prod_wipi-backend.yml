# .github/workflows/azure-deploy.yml

name: Build and deploy JAR app to Azure Web App - wipi-backend

# prod 브랜치에 푸시되거나 수동 트리거 시 동작
on:
  push:
    branches: [ prod ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read    # actions/checkout에 필요

    steps:
      # 1) 소스 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) JDK 21 설치
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 3) Gradle CLI 설치 (캐시 포함)
      - name: Set up Gradle CLI
        uses: gradle/gradle-build-action@v2
        with:
          cache-enabled: true

      # 4) 프로젝트 빌드
      - name: Build with Gradle
        run: gradle clean build --no-daemon

      # 5) 빌드된 JAR 중 첫 번째만 artifact/app.jar 로 복사
      - name: Prepare single JAR artifact
        run: |
          mkdir -p artifact
          cp build/libs/*.jar artifact/app.jar
          echo "Artifact contents:"
          ls -l artifact

      # 6) artifact/app.jar 업로드
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: artifact/app.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    environment:
      name: Production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      # 1) 업로드한 artifact/app.jar 다운로드
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: java-app
          path: deploy

      # 2) deploy 디렉터리 확인 (옵션)
      - name: List deploy folder
        run: ls -l deploy

      # 3) Azure Web App에 배포
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'wipi-backend'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_B6FDEDBFBDB54590BC6DAD37985E8B9B }}
          package: 'deploy/artifact/app.jar'
