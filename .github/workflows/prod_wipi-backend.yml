# .github/workflows/azure-deploy.yml

name: Build and deploy JAR app to Azure Web App - wipi-backend

on:
  push:
    branches:
      - prod
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read    # actions/checkout에 필요

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle CLI
        uses: gradle/gradle-build-action@v2
        with:
          cache-enabled: true

      - name: Build with Gradle
        run: gradle clean build --no-daemon

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'wipi-backend'  
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_B6FDEDBFBDB54590BC6DAD37985E8B9B }}
          package: 'build/libs/wipi-backend-0.0.1-SNAPSHOT.jar'

