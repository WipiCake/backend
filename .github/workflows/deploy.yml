name: Ruffy branch CI/CD

on:
  push:
    branches: [ ruffy ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.4
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.4'

      - name: Build Spring Boot JAR
        run: gradle clean bootJar -x test

      - name: Build Docker image
        run: docker build -t my-spring-app:latest .

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci
          ssh-keyscan -p ${{ secrets.SERVER_SSH_PORT }} \
                      ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts


      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          source: |
            Dockerfile
            docker-compose.yml
            build/libs/*.jar
          target: ~/spring-deploy

      - name: Remote deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            cd ~/spring-deploy
            docker compose down
            docker compose up -d --build spring-app
